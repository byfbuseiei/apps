<!DOCTYPE html>
<html lang="th">
<head>
<meta name="theme-color" content="#6D4AE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JumDee">
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JumDee จำดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<style>
/*
  JumDee — มือถือเป็นหลัก ธีมม่วง-ขาว
  โครง: grid 4 แถว (หัว / ช่องพิมพ์ / เนื้อหาเลื่อนได้ / เมนู) ทุกส่วนล็อกแถวไว้ ส่วนที่ซ่อนไม่ทำให้ส่วนอื่นเลื่อน
  สีความสำคัญ: ด่วน = แดง, สำคัญ = เหลืองอำพัน, ทำเมื่อว่าง = เทา
*/
:root{
  --paper:#F7F5FD; --surface:#FFFFFF; --ink:#1F1640; --muted:#6B6488; --line:#E4DFF4; --soft:#F0ECFB;
  --brand:#6D4AE0; --brand-ink:#FFFFFF; --brand-soft:#ECE6FD; --brand-strong:#4F2FC4;
  --urgent:#C8323A; --urgent-soft:#FDECEC; --important:#9A6200; --important-soft:#FFF4DC; --later:#5F5E73; --later-soft:#EFEEF4;
  --ok:#147A4C; --ok-soft:#E3F5EC;
  --font:"IBM Plex Sans Thai Looped","IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --fs-s:13px; --fs-b:15px; --fs-m:17px; --fs-l:20px; --fs-xl:28px;
  --gut:max(16px,env(safe-area-inset-left)); --gut-r:max(16px,env(safe-area-inset-right));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#120E22; --surface:#1C1733; --ink:#EEEAFB; --muted:#A79FC6; --line:#2E2750; --soft:#231C40;
    --brand:#A58BFF; --brand-ink:#1A0F45; --brand-soft:#2C2357; --brand-strong:#C3B2FF;
    --urgent:#FF8E8E; --urgent-soft:#3D1D24; --important:#F2C267; --important-soft:#3A2E14; --later:#B9B6CC; --later-soft:#2A2640;
    --ok:#5FD49C; --ok-soft:#143326;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs-b);line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
/* มือถือ: ช่องกรอกต้อง 16px ขึ้นไป ไม่งั้น iPhone ซูมหน้าจอเองทุกครั้งที่แตะ */
input,select,textarea{font-size:16px}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{flex:none;display:block}

/* ---------- โครงหน้า ---------- */
#app{height:100%;height:100dvh;max-width:600px;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--paper);position:relative}
#app>.top{grid-row:1}#app>.composer{grid-row:2}#app>main{grid-row:3}#app>.tabs{grid-row:4}
#app>.overlay-host,#app>.toast-host{grid-row:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px var(--gut-r) 6px var(--gut)}
.top h1{margin:0;font-size:var(--fs-l);font-weight:600;color:var(--brand-strong)}
.top h1 small{font-size:var(--fs-s);color:var(--muted);font-weight:500}
.top-r{display:flex;align-items:center;gap:6px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px var(--gut-r) 24px var(--gut);display:flex;flex-direction:column;gap:12px;min-width:0}
main>*{min-width:0;flex-shrink:0}
.center{text-align:center;margin:24px auto}

/* ---------- ช่องพิมพ์ + ไมค์ ---------- */
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end;margin:0 var(--gut-r) 8px var(--gut);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 14px}
.composer:focus-within{border-color:var(--brand)}
.composer-input{border:0;background:transparent;resize:none;min-height:40px;font-size:16px;max-height:120px;padding:6px 0;outline:none;line-height:1.45;width:100%}
.composer-input::placeholder{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic,.send{border:0;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.mic{width:40px;background:var(--brand);color:var(--brand-ink)}
.mic.on{background:var(--urgent);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--urgent-soft)}}
.send{padding:0 12px;background:var(--brand-soft);color:var(--brand-strong);font-weight:500;font-size:var(--fs-s)}
[aria-busy]{opacity:.6}

/* ---------- ปุ่ม / ช่องกรอก ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.small{min-height:40px;padding:4px 12px;font-size:var(--fs-s)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ai{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong)}
.btn.danger{background:var(--urgent);border-color:var(--urgent);color:#fff}
.btn.danger-ghost{color:var(--urgent);border-color:var(--urgent-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:var(--soft)}
.icon-btn:disabled{opacity:.3}
.link{border:0;background:none;padding:10px 0;min-height:40px;color:var(--brand-strong);text-decoration:underline;text-underline-offset:3px;text-align:left}
input:not([type=checkbox]),select,textarea.plain{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px}
input:focus,select:focus{border-color:var(--brand);outline:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:var(--fs-s);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:var(--fs-s)}
.err{color:var(--urgent);font-size:var(--fs-s);margin:4px 0}
.ok{color:var(--ok)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.inline{display:flex;gap:8px}

/* ---------- ตัวกรองหมวด ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:auto;overscroll-behavior-x:contain;padding-bottom:2px;margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut));padding-left:var(--gut);padding-right:var(--gut-r)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:40px;font-size:var(--fs-s);white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- รายการงาน ---------- */
.group{display:flex;flex-direction:column}
.sec{margin:6px 0 4px;font-size:var(--fs-s);font-weight:600;letter-spacing:.2px}
.group.urgent .sec{color:var(--urgent)}.group.important .sec{color:var(--important)}.group.later .sec{color:var(--later)}
.sec-btn{border:0;background:none;padding:6px 0;display:flex;align-items:center;gap:6px;color:var(--muted)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.task-wrap.open{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin:4px 0}
.task-wrap.open .task{border-bottom:1px dashed var(--line)}
.box{width:26px;height:26px;margin-top:1px;border:2px solid var(--muted);border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#fff;flex:none;position:relative}
/* ช่องติ๊กดูเล็ก แต่พื้นที่กดใหญ่ 44px ให้นิ้วกดโดนง่าย */
.box::after{content:"";position:absolute;inset:-9px}
.box.sm::after{inset:-11px}
.box.on{background:var(--ok);border-color:var(--ok)}
.box.sm{width:22px;height:22px;border-radius:6px}
.group.urgent .box:not(.on){border-color:var(--urgent)}
.task-body{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:28px}
.task-title{font-size:var(--fs-b);overflow-wrap:anywhere}
.task-meta{font-size:12.5px;color:var(--muted)}
.due.hot{color:var(--urgent);font-weight:600}
/* กดค้างลากจัดลำดับ: กดค้างแล้วไม่ให้เลือกข้อความ/เมนูของเบราว์เซอร์เด้ง */
[data-drag-id]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-src{opacity:.25}
.drag-ghost{position:fixed;z-index:40;pointer-events:none;background:var(--surface);border:1px solid var(--brand);border-radius:14px;padding:0 12px;box-shadow:0 10px 28px rgba(31,22,64,.25);transform:scale(1.02)}
.drop-line{height:4px;margin:4px 0;border-radius:2px;background:var(--brand)}
.group.drop-empty{border:2px dashed var(--line);border-radius:14px;padding:4px 12px 12px;margin:4px 0}
.task.pending{opacity:.55}
.task.pending .task-meta::after{content:" · กำลังบันทึก…"}
.is-done .task-title{text-decoration:line-through;color:var(--muted)}
.task-detail{padding:8px 0 12px;display:flex;flex-direction:column;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:center}
.step-t.done{text-decoration:line-through;color:var(--muted)}
.note{margin:0;color:var(--muted);font-size:var(--fs-s);white-space:pre-wrap}
.empty{text-align:center;padding:28px 8px}
.empty-t{font-size:var(--fs-m);font-weight:600;margin:0 0 6px}

/* ---------- การ์ด / สรุป ---------- */
.page-t{margin:4px 0 0;font-size:var(--fs-l);font-weight:600}
.page-head{display:flex;align-items:center;gap:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3,.sub{margin:0;font-size:var(--fs-b);font-weight:600}
.sub{margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.tile span{font-size:var(--fs-s);color:var(--muted)}
.tile b{font-size:var(--fs-xl);font-weight:600;font-variant-numeric:tabular-nums}
.tile.good b{color:var(--ok)}.tile.hot b{color:var(--urgent)}.tile.warn b{color:var(--important)}
.focus{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.focus li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-block;font-size:12px;padding:1px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.urgent{background:var(--urgent-soft);color:var(--urgent)}.pill.important{background:var(--important-soft);color:var(--important)}.pill.later{background:var(--later-soft);color:var(--later)}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-l{display:flex;justify-content:space-between;font-size:var(--fs-s)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}

/* ---------- หมวด / คู่มือคำ ---------- */
.cats{display:flex;flex-direction:column;gap:8px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.cat .emoji{text-align:center;padding:8px 4px}
.cat-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.cat-act{display:flex;flex-direction:column}
.lex-head{margin-top:16px}
.lex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lex{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"w x" "m x" "c x";column-gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lex-w{grid-area:w;font-weight:500;overflow-wrap:anywhere}
.lex-m{grid-area:m;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:var(--fs-s)}
.lex>.muted{grid-area:c}
.lex>.icon-btn{grid-area:x;align-self:center}
.seed{font-size:var(--fs-s);color:var(--muted);margin:0;line-height:1.9}

/* ---------- ปฏิทิน ---------- */
:root{--free:#E3F5EC;--free-ink:#147A4C;--light:#FFF4DC;--busy:#FDE3E3}
@media (prefers-color-scheme: dark){:root{--free:#143326;--free-ink:#5FD49C;--light:#3A2E14;--busy:#3D1D24}}
.cal-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:4px}
.cal-title{text-align:center;margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cal-cell{border:1px solid transparent;border-radius:10px;min-height:48px;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:var(--surface);font-variant-numeric:tabular-nums}
.cal-cell.out{background:transparent}
.cal-cell.free{background:var(--free)}
.cal-cell.free .cal-n{color:var(--free-ink);font-weight:600}
.cal-cell.light{background:var(--light)}
.cal-cell.busy{background:var(--busy)}
.cal-cell.past{background:transparent;color:var(--muted)}
.cal-cell.overdue{border-color:var(--urgent)}
.cal-cell.today .cal-n{background:var(--brand);color:var(--brand-ink);border-radius:999px;min-width:24px;padding:0 6px}
.cal-cell.sel{border-color:var(--brand);border-width:2px}
.cal-n{font-size:var(--fs-s);line-height:22px}
.cal-dots{display:flex;gap:2px;height:6px}
.cal-dots i,.cal-legend .dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--later)}
.cal-dots i.urgent,.cal-legend .dot.urgent{background:var(--urgent)}
.cal-dots i.important,.cal-legend .dot.important{background:var(--important)}
.cal-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:4px}
.cal-legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.sw.free{background:var(--free)}.sw.light{background:var(--light)}.sw.busy{background:var(--busy)}
.pill.load.free{background:var(--free);color:var(--free-ink)}.pill.load.light{background:var(--light);color:var(--important)}.pill.load.busy{background:var(--busy);color:var(--urgent)}.pill.load.past{background:var(--later-soft);color:var(--later)}
.cal-tasks{display:flex;flex-direction:column}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}

/* ---------- ล็อก ---------- */
.lock{max-width:380px;width:100%;margin:24px auto;display:flex;flex-direction:column;gap:10px;text-align:center}
.lock-ic{width:64px;height:64px;border-radius:20px;background:var(--brand-soft);color:var(--brand-strong);display:flex;align-items:center;justify-content:center;margin:0 auto}
.lock h2{margin:4px 0 0;font-size:var(--fs-l)}
.lock p{margin:0}
.lock-form{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:8px}
.lock .link{align-self:center;margin-top:4px}

/* ---------- เมนูล่าง ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:4px 0 max(4px,env(safe-area-inset-bottom))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;min-height:52px;font-size:12px;color:var(--muted)}
.tab.on{color:var(--brand-strong);font-weight:600}

/* ---------- หน้าต่างเด้ง ---------- */
.backdrop{position:fixed;inset:0;background:rgba(18,10,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:92dvh;border-radius:20px 20px 0 0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px var(--gut-r) 4px var(--gut)}
.sheet-head h2{margin:0;font-size:var(--fs-m)}
.sheet-body{overflow-y:auto;padding:4px var(--gut-r) 12px var(--gut);display:flex;flex-direction:column;gap:12px}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px var(--gut-r) max(12px,env(safe-area-inset-bottom)) var(--gut);border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.draft{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.draft.has-err{border-color:var(--urgent)}
.draft-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.draft-title{font-weight:600}
.draft-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.seg-b{border:0;background:transparent;border-radius:9px;min-height:40px;font-size:var(--fs-s);color:var(--muted)}
.seg-b.on{background:var(--surface);font-weight:600}
.seg-b.on.urgent{color:var(--urgent)}.seg-b.on.important{color:var(--important)}.seg-b.on.later{color:var(--ink)}
.edit-steps{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
.edit-steps li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.edit-steps input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.num{color:var(--muted);font-size:var(--fs-s);width:20px;text-align:right}
.ai-note,.warn-note{margin:0;font-size:var(--fs-s);display:flex;gap:6px;align-items:center;padding:8px 12px;border-radius:12px}
.ai-note{background:var(--brand-soft);color:var(--brand-strong)}
.warn-note{background:var(--important-soft);color:var(--important)}
.sugg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sugg li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}

/* ---------- แจ้งเตือน ---------- */
.toast-host{position:fixed;left:0;right:0;bottom:84px;display:flex;justify-content:center;pointer-events:none;z-index:30;padding:0 16px}
.toast{background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:var(--fs-s);max-width:420px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.bad{background:var(--urgent);color:#fff}

@media (min-width:600px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.backdrop{align-items:center}.sheet{border-radius:20px}}
@media (max-width:340px){.send span{display:none}.send{padding:0 10px}.draft-row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
